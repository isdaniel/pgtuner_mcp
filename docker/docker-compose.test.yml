services:
  pg14:
    build: { context: ., dockerfile: Dockerfile.pg, args: { PG_VERSION: "14" } }
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: pgtuner_test
    ports: ["5414:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
