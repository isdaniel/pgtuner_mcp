[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts = -v --tb=short -m "not integration"
markers =
    integration: requires a live PostgreSQL (skip with -m 'not integration')
    pg14_plus: skip if PG < 14
    pg16_plus: skip if PG < 16
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
