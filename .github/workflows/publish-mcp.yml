name: Publish to MCP Registry

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install mcp-publisher
      run: |
        # Install mcp-publisher CLI (v1.7.9+ uses the correct OIDC audience https://registry.modelcontextprotocol.io)
        curl -L "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher && sudo mv mcp-publisher /usr/local/bin/

    - name: Authenticate with MCP Registry
      run: |
        # Use GitHub OIDC authentication for organization-level publishing
        mcp-publisher login github-oidc

    - name: Publish to MCP Registry
      run: |
        mcp-publisher publish
